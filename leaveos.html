<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeaveOS — Enterprise Leave Management</title>
<style>
/* ============================================================
   DESIGN TOKENS & RESET
   ============================================================ */
:root {
  --hr-sidebar-w: 240px;
  --hr-topbar-h: 56px;
  --hr-gap-xs: 4px;
  --hr-gap-sm: 8px;
  --hr-gap-md: 12px;
  --hr-gap-lg: 16px;
  --hr-gap-xl: 20px;
  --hr-gap-2xl: 24px;
  --hr-gap-3xl: 32px;
  --hr-radius-sm: 4px;
  --hr-radius-md: 8px;
  --hr-radius-lg: 10px;
  --hr-radius-xl: 12px;
  --hr-shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --hr-shadow-md: 0 2px 8px rgba(0,0,0,0.06);
  --hr-shadow-lg: 0 4px 16px rgba(0,0,0,0.08);
  --hr-transition: all 0.15s ease;
  --hr-green: #10b981;
  --hr-red: #ef4444;
  --hr-amber: #f59e0b;
  --hr-blue: #3b82f6;
  --hr-purple: #8b5cf6;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #fafafa; color: #111; line-height: 1.5; }
button, input, select, textarea { font: inherit; }

/* ============================================================
   LAYOUT
   ============================================================ */
.hr-app { display: flex; min-height: 100vh; }
.hr-sidebar {
  width: var(--hr-sidebar-w); flex-shrink: 0;
  background: #fff; border-right: 1px solid #e5e5e5;
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; z-index: 50;
}
.hr-sidebar-header {
  height: var(--hr-topbar-h); display: flex; align-items: center;
  padding: 0 var(--hr-gap-lg); gap: var(--hr-gap-sm);
  border-bottom: 1px solid #e5e5e5;
}
.hr-logo-mark {
  width: 28px; height: 28px; border-radius: var(--hr-radius-md);
  background: #111; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.hr-logo-text { font-size: 17px; font-weight: 500; color: #111; letter-spacing: -0.3px; }
.hr-nav { flex: 1; padding: var(--hr-gap-sm) var(--hr-gap-md); overflow-y: auto; }
.hr-nav-section { margin-bottom: var(--hr-gap-lg); }
.hr-nav-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
  color: #999; padding: 0 var(--hr-gap-md); margin-bottom: var(--hr-gap-xs);
}
.hr-nav-item {
  display: flex; align-items: center; gap: var(--hr-gap-md);
  padding: var(--hr-gap-sm) var(--hr-gap-md); border-radius: var(--hr-radius-md);
  color: #666; font-size: 13px; font-weight: 500; cursor: pointer;
  transition: var(--hr-transition); position: relative; text-decoration: none;
}
.hr-nav-item:hover { background: #f5f5f5; color: #111; }
.hr-nav-item.active { background: #111; color: #fff; }
.hr-nav-item.active svg { opacity: 1; }
.hr-nav-item svg { opacity: 0.6; flex-shrink: 0; }
.hr-nav-badge {
  margin-left: auto; background: var(--hr-red); color: #fff;
  font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; min-width: 18px; text-align: center;
}
.hr-sidebar-footer {
  padding: var(--hr-gap-md); border-top: 1px solid #e5e5e5;
}
.hr-user-card {
  display: flex; align-items: center; gap: var(--hr-gap-md);
  padding: var(--hr-gap-sm); border-radius: var(--hr-radius-md); cursor: pointer;
  transition: var(--hr-transition);
}
.hr-user-card:hover { background: #f5f5f5; }
.hr-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; font-weight: 500; flex-shrink: 0;
}
.hr-user-name { font-size: 13px; font-weight: 500; color: #111; }
.hr-user-role { font-size: 11px; color: #999; }

.hr-main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.hr-topbar {
  height: var(--hr-topbar-h); border-bottom: 1px solid #e5e5e5;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--hr-gap-xl); background: #fff; position: sticky; top: 0; z-index: 40;
}
.hr-breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 14px; color: #666; }
.hr-breadcrumb-current { font-weight: 500; color: #111; }
.hr-topbar-actions { display: flex; align-items: center; gap: var(--hr-gap-sm); }
.hr-icon-btn {
  width: 36px; height: 36px; border-radius: var(--hr-radius-md); border: 1px solid #e5e5e5;
  background: transparent; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: #666; transition: var(--hr-transition); position: relative;
}
.hr-icon-btn:hover { background: #f5f5f5; color: #111; }
.hr-icon-btn .hr-dot {
  position: absolute; top: 6px; right: 6px; width: 8px; height: 8px;
  border-radius: 50%; background: var(--hr-red); border: 2px solid #fff;
}
.hr-content { flex: 1; overflow-y: auto; padding: var(--hr-gap-2xl); }

/* ============================================================
   PAGE HEADER
   ============================================================ */
.hr-page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--hr-gap-2xl); gap: var(--hr-gap-lg); flex-wrap: wrap; }
.hr-page-title { font-size: 20px; font-weight: 500; color: #111; line-height: 1.3; }
.hr-page-subtitle { font-size: 14px; color: #999; margin-top: 2px; }

/* ============================================================
   BUTTONS
   ============================================================ */
.hr-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--hr-gap-sm);
  height: 36px; padding: 0 var(--hr-gap-lg); border-radius: var(--hr-radius-md);
  font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent;
  transition: var(--hr-transition); white-space: nowrap;
}
.hr-btn-primary { background: #111; color: #fff; }
.hr-btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
.hr-btn-secondary { background: #fff; color: #111; border-color: #e5e5e5; }
.hr-btn-secondary:hover { background: #f5f5f5; }
.hr-btn-ghost { background: transparent; color: #666; }
.hr-btn-ghost:hover { background: #f5f5f5; color: #111; }
.hr-btn-danger { background: color-mix(in srgb, var(--hr-red) 8%, transparent); color: var(--hr-red); border-color: color-mix(in srgb, var(--hr-red) 20%, transparent); }
.hr-btn-danger:hover { background: color-mix(in srgb, var(--hr-red) 15%, transparent); }
.hr-btn-sm { height: 28px; padding: 0 var(--hr-gap-md); font-size: 12px; }

/* ============================================================
   CARDS
   ============================================================ */
.hr-card { background: #fff; border: 1px solid #e5e5e5; border-radius: var(--hr-radius-xl); overflow: hidden; transition: var(--hr-transition); }
.hr-card:hover { box-shadow: var(--hr-shadow-md); }
.hr-card-header { display: flex; align-items: center; justify-content: space-between; padding: var(--hr-gap-lg) var(--hr-gap-xl); border-bottom: 1px solid #e5e5e5; }
.hr-card-title { font-size: 15px; font-weight: 500; color: #111; }
.hr-card-action { font-size: 13px; color: #999; cursor: pointer; transition: color 0.15s; }
.hr-card-action:hover { color: #111; text-decoration: underline; }
.hr-card-body { padding: var(--hr-gap-xl); }

/* ============================================================
   STATS
   ============================================================ */
.hr-stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--hr-gap-lg); }
.hr-stat-card { padding: var(--hr-gap-xl); border-radius: var(--hr-radius-lg); border: 1px solid #e5e5e5; background: #fff; transition: var(--hr-transition); }
.hr-stat-card:hover { border-color: #ccc; transform: translateY(-1px); }
.hr-stat-label { font-size: 12px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: var(--hr-gap-sm); }
.hr-stat-value { font-size: 32px; font-weight: 500; color: #111; line-height: 1; margin-bottom: var(--hr-gap-sm); font-variant-numeric: tabular-nums; }
.hr-stat-delta { font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.hr-stat-delta.up { color: var(--hr-green); }
.hr-stat-delta.down { color: var(--hr-red); }
.hr-stat-delta.neutral { color: #999; }

/* ============================================================
   TABLES
   ============================================================ */
.hr-table-wrap { overflow-x: auto; border-radius: var(--hr-radius-lg); border: 1px solid #e5e5e5; }
.hr-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.hr-table th { text-align: left; padding: var(--hr-gap-sm) var(--hr-gap-lg); font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.4px; background: #f5f5f5; border-bottom: 1px solid #e5e5e5; white-space: nowrap; }
.hr-table td { padding: var(--hr-gap-md) var(--hr-gap-lg); border-bottom: 1px solid #e5e5e5; color: #111; vertical-align: middle; }
.hr-table tbody tr { transition: background 0.15s; }
.hr-table tbody tr:hover { background: #f5f5f5; }
.hr-table tbody tr:last-child td { border-bottom: none; }

/* ============================================================
   BADGES & TAGS
   ============================================================ */
.hr-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
.hr-badge-dot { width: 6px; height: 6px; border-radius: 50%; }
.hr-badge-dot.pending { background: var(--hr-amber); }
.hr-badge-dot.approved { background: var(--hr-green); }
.hr-badge-dot.rejected { background: var(--hr-red); }
.hr-badge-dot.cancelled { background: #999; }
.hr-badge-pending { background: color-mix(in srgb, var(--hr-amber) 10%, transparent); color: var(--hr-amber); }
.hr-badge-approved { background: color-mix(in srgb, var(--hr-green) 10%, transparent); color: var(--hr-green); }
.hr-badge-rejected { background: color-mix(in srgb, var(--hr-red) 10%, transparent); color: var(--hr-red); }
.hr-badge-cancelled { background: #f5f5f5; color: #999; }

.hr-tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; }
.hr-tag-vacation { background: color-mix(in srgb, var(--hr-blue) 10%, transparent); color: var(--hr-blue); }
.hr-tag-sick { background: color-mix(in srgb, var(--hr-red) 10%, transparent); color: var(--hr-red); }
.hr-tag-personal { background: color-mix(in srgb, var(--hr-purple) 10%, transparent); color: var(--hr-purple); }
.hr-tag-remote { background: color-mix(in srgb, var(--hr-green) 10%, transparent); color: var(--hr-green); }

/* ============================================================
   EMPLOYEE CELL
   ============================================================ */
.hr-employee-cell { display: flex; align-items: center; gap: var(--hr-gap-md); }
.hr-employee-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 500; flex-shrink: 0; }
.hr-employee-name { font-size: 13px; font-weight: 500; color: #111; }
.hr-employee-dept { font-size: 11px; color: #999; }

/* ============================================================
   FILTERS
   ============================================================ */
.hr-filters { display: flex; align-items: center; gap: var(--hr-gap-sm); margin-bottom: var(--hr-gap-xl); flex-wrap: wrap; }
.hr-filter-chip { display: inline-flex; align-items: center; gap: var(--hr-gap-sm); padding: var(--hr-gap-xs) var(--hr-gap-md); border-radius: var(--hr-radius-md); border: 1px solid #e5e5e5; background: #fff; font-size: 13px; color: #666; cursor: pointer; transition: var(--hr-transition); user-select: none; }
.hr-filter-chip:hover { border-color: #ccc; }
.hr-filter-chip.active { background: #111; color: #fff; border-color: #111; }
.hr-filter-select { height: 32px; padding: 0 var(--hr-gap-md); border: 1px solid #e5e5e5; border-radius: var(--hr-radius-md); background: #fff; font-size: 13px; color: #111; cursor: pointer; }

/* ============================================================
   CALENDAR
   ============================================================ */
.hr-calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: #e5e5e5; border-radius: var(--hr-radius-lg); overflow: hidden; border: 1px solid #e5e5e5; }
.hr-cal-header { background: #f5f5f5; padding: var(--hr-gap-sm); text-align: center; font-size: 11px; font-weight: 600; color: #999; text-transform: uppercase; }
.hr-cal-day { background: #fff; min-height: 100px; padding: var(--hr-gap-sm); position: relative; }
.hr-cal-day.other { background: #f5f5f5; }
.hr-cal-day-num { font-size: 13px; font-weight: 500; color: #111; margin-bottom: var(--hr-gap-xs); }
.hr-cal-day.other .hr-cal-day-num { color: #ccc; }
.hr-cal-event { font-size: 10px; padding: 2px 6px; border-radius: 3px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.hr-cal-event.vacation { background: color-mix(in srgb, var(--hr-blue) 12%, transparent); color: var(--hr-blue); }
.hr-cal-event.sick { background: color-mix(in srgb, var(--hr-red) 12%, transparent); color: var(--hr-red); }
.hr-cal-event.personal { background: color-mix(in srgb, var(--hr-purple) 12%, transparent); color: var(--hr-purple); }
.hr-cal-event.remote { background: color-mix(in srgb, var(--hr-green) 12%, transparent); color: var(--hr-green); }

/* ============================================================
   CHARTS
   ============================================================ */
.hr-chart-bar { display: flex; align-items: flex-end; justify-content: space-around; padding: var(--hr-gap-xl) var(--hr-gap-md) var(--hr-gap-sm); }
.hr-chart-bar-item { display: flex; flex-direction: column; align-items: center; flex: 1; max-width: 60px; }
.hr-chart-bar-value { font-size: 12px; font-weight: 500; color: #111; margin-bottom: 6px; }
.hr-chart-bar-fill { width: 100%; max-width: 36px; border-radius: 4px 4px 0 0; transition: height 0.6s ease; }
.hr-chart-bar-label { font-size: 11px; color: #999; margin-top: 6px; }

.hr-donut { position: relative; width: 140px; height: 140px; }
.hr-donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.hr-donut-value { font-size: 28px; font-weight: 500; color: #111; line-height: 1; }
.hr-donut-label { font-size: 11px; color: #999; margin-top: 2px; }

/* ============================================================
   EMPTY STATES
   ============================================================ */
.hr-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--hr-gap-3xl) var(--hr-gap-2xl); text-align: center; }
.hr-empty-icon { color: #ccc; margin-bottom: var(--hr-gap-md); }
.hr-empty-title { font-size: 15px; font-weight: 500; color: #111; margin-bottom: var(--hr-gap-xs); }
.hr-empty-desc { font-size: 13px; color: #999; max-width: 300px; }

/* ============================================================
   MODAL
   ============================================================ */
.hr-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.hr-modal-overlay.open { opacity: 1; pointer-events: all; }
.hr-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.96); background: #fff; border-radius: var(--hr-radius-xl); box-shadow: var(--hr-shadow-lg); max-width: 520px; width: 90%; max-height: 85vh; overflow: hidden; opacity: 0; pointer-events: none; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; z-index: 101; }
.hr-modal.open { opacity: 1; pointer-events: all; transform: translate(-50%, -50%) scale(1); }
.hr-modal-header { display: flex; align-items: center; justify-content: space-between; padding: var(--hr-gap-xl) var(--hr-gap-2xl) var(--hr-gap-md); }
.hr-modal-title { font-size: 17px; font-weight: 500; color: #111; }
.hr-modal-close { width: 32px; height: 32px; border-radius: var(--hr-radius-md); border: none; background: transparent; color: #999; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--hr-transition); }
.hr-modal-close:hover { background: #f5f5f5; color: #111; }
.hr-modal-body { padding: var(--hr-gap-md) var(--hr-gap-2xl) var(--hr-gap-xl); overflow-y: auto; flex: 1; }
.hr-modal-footer { display: flex; justify-content: flex-end; gap: var(--hr-gap-md); padding: var(--hr-gap-md) var(--hr-gap-2xl) var(--hr-gap-xl); border-top: 1px solid #e5e5e5; background: #f5f5f5; }

/* ============================================================
   FORM ELEMENTS
   ============================================================ */
.hr-form-group { margin-bottom: var(--hr-gap-lg); }
.hr-form-label { display: block; font-size: 13px; font-weight: 500; color: #111; margin-bottom: var(--hr-gap-xs); }
.hr-form-input, .hr-form-select, .hr-form-textarea { width: 100%; height: 40px; padding: 0 var(--hr-gap-md); border: 1px solid #e5e5e5; border-radius: var(--hr-radius-md); background: #fff; font-size: 14px; color: #111; transition: var(--hr-transition); }
.hr-form-input:focus, .hr-form-select:focus, .hr-form-textarea:focus { outline: none; border-color: #111; box-shadow: 0 0 0 3px rgba(0,0,0,0.06); }
.hr-form-textarea { height: auto; min-height: 80px; padding: var(--hr-gap-sm) var(--hr-gap-md); resize: vertical; }
.hr-form-hint { font-size: 12px; color: #999; margin-top: 4px; }
.hr-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--hr-gap-lg); }

/* ============================================================
   TOASTS
   ============================================================ */
.hr-toast-container { position: fixed; top: 16px; right: 16px; z-index: 200; display: flex; flex-direction: column; gap: var(--hr-gap-sm); }
.hr-toast { display: flex; align-items: center; gap: var(--hr-gap-md); padding: var(--hr-gap-md) var(--hr-gap-xl); border-radius: var(--hr-radius-lg); box-shadow: var(--hr-shadow-lg); font-size: 13px; font-weight: 500; animation: toastIn 0.3s ease; min-width: 280px; }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
.hr-toast-success { background: color-mix(in srgb, var(--hr-green) 12%, transparent); color: var(--hr-green); border: 1px solid color-mix(in srgb, var(--hr-green) 25%, transparent); }
.hr-toast-error { background: color-mix(in srgb, var(--hr-red) 12%, transparent); color: var(--hr-red); border: 1px solid color-mix(in srgb, var(--hr-red) 25%, transparent); }
.hr-toast-info { background: color-mix(in srgb, var(--hr-blue) 12%, transparent); color: var(--hr-blue); border: 1px solid color-mix(in srgb, var(--hr-blue) 25%, transparent); }

/* ============================================================
   HOVER REVEAL ROW ACTIONS
   ============================================================ */
.row-actions { opacity: 0; transition: opacity 0.2s; }
tr:hover .row-actions, tr:focus-within .row-actions { opacity: 1; }

/* ============================================================
   LAYOUT UTILITIES
   ============================================================ */
.hr-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--hr-gap-lg); }
.hr-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--hr-gap-lg); }
.hr-flex { display: flex; }
.hr-gap-sm { gap: var(--hr-gap-sm); }
.hr-gap-md { gap: var(--hr-gap-md); }
.hr-gap-lg { gap: var(--hr-gap-lg); }
.hr-mb-xl { margin-bottom: var(--hr-gap-xl); }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 1024px) {
  .hr-sidebar { position: fixed; transform: translateX(-100%); transition: transform 0.3s ease; }
  .hr-sidebar.open { transform: translateX(0); }
  .hr-stat-grid { grid-template-columns: repeat(2, 1fr); }
  .hr-grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .hr-content { padding: var(--hr-gap-lg); }
  .hr-stat-grid { grid-template-columns: 1fr; }
  .hr-page-header { flex-direction: column; align-items: flex-start; }
  .hr-filters { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
}
</style>
</head>
<body>
<div class="hr-app">
  <aside class="hr-sidebar" id="sidebar">
    <div class="hr-sidebar-header">
      <div class="hr-logo-mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <span class="hr-logo-text">LeaveOS</span>
    </div>
    <nav class="hr-nav" id="nav"></nav>
    <div class="hr-sidebar-footer">
      <div class="hr-user-card" onclick="navigate('profile')">
        <div class="hr-avatar" id="current-user-avatar" style="background:#3b82f6;">SC</div>
        <div>
          <div class="hr-user-name" id="current-user-name">Sarah Chen</div>
          <div class="hr-user-role" id="current-user-role">Engineering Manager</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="hr-main">
    <header class="hr-topbar" id="topbar">
      <div class="hr-breadcrumb">
        <span>LeaveOS</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        <span class="hr-breadcrumb-current" id="page-breadcrumb">Dashboard</span>
      </div>
      <div class="hr-topbar-actions">
        <button class="hr-icon-btn" style="position:relative;" title="Notifications" aria-label="Notifications" onclick="showNotifications()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="hr-dot"></span>
        </button>
        <button class="hr-icon-btn" title="Help" aria-label="Help" onclick="showHelp()">

  constructor() { this.prefix = 'hr_'; }

  getAll(c) { const d = localStorage.getItem(this._key(c)); return d ? JSON.parse(d) : []; }
  getById(c, id) { return this.getAll(c).find(x => x.id === id); }
  create(c, item) { const all = this.getAll(c); all.push(item); localStorage.setItem(this._key(c), JSON.stringify(all)); return item; }
  update(c, id, u) { const all = this.getAll(c); const i = all.findIndex(x => x.id === id); if (i !== -1) { all[i] = { ...all[i], ...u }; localStorage.setItem(this._key(c), JSON.stringify(all)); } return all[i]; }
  delete(c, id) { localStorage.setItem(this._key(c), JSON.stringify(this.getAll(c).filter(x => x.id !== id))); }
  query(c, p) { return this.getAll(c).filter(p); }
}

    const all = leaveService.getAll();

    const avgTime = approved.length > 0 ? (approved.reduce((s, r) => s + (new Date(r.approvedAt) - new Date(r.createdAt)), 0) / approved.length / (1000*60*60*24)) : 0;

  getLeaveTrends: (months = 6) => {
    const all = leaveService.getAll();
    const trends = {};
    const now = new Date();
    for (let i = months - 1; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);

    }
    return trends;
  },
  getDepartmentStats: () => {
    const employees = employeeService.getAll();
    const requests = leaveService.getAll();

    });
    return stats;
  },
};

// ============================================================

function getAvatarColor(name) {
  const colors = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#f97316'];
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return colors[Math.abs(hash) % colors.length];
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function formatDateShort(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'Just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  if (days < 7) return days + 'd ago';
  return formatDate(dateStr);
}

function getStatusBadge(status) {
  const map = { pending: 'Pending', approved: 'Approved', rejected: 'Rejected', cancelled: 'Cancelled' };
  return '<span class="hr-badge hr-badge-' + status + '"><span class="hr-badge-dot ' + status + '"></span>' + map[status] + '</span>';
}

  const t = LEAVE_TYPES.find(x => x.id === type) || LEAVE_TYPES[0];
  return '<span class="hr-tag hr-tag-' + type + '">' + t.label + '</span>';
}

function getEmployeeCell(emp) {

function showToast(message, type) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = 'hr-toast hr-toast-' + type;
  toast.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' + message;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateX(20px)'; setTimeout(() => toast.remove(), 300); }, 4000);
}

// ============================================================
// MODAL SYSTEM
// ============================================================
function openModal(title, bodyHtml, footerHtml) {
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal');
  modal.innerHTML = '<div class="hr-modal-header"><div class="hr-modal-title">' + title + '</div><button class="hr-modal-close" onclick="closeModal()" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div class="hr-modal-body">' + bodyHtml + '</div>' + (footerHtml ? '<div class="hr-modal-footer">' + footerHtml + '</div>' : '');
  overlay.classList.add('open');
  modal.classList.add('open');
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('modal').classList.remove('open');
}

// ============================================================
// NAVIGATION
// ============================================================
function navigate(page) {
  currentPage = page;
  renderNav();
  renderBreadcrumb();
  renderPage();
}

function renderNav() {
  const nav = document.getElementById('nav');
  const pendingCount = repo.query('leave_requests', r => r.managerId === currentUser.id && r.status === 'pending').length;
  let html = '';
  let currentSection = '';
  NAV_ITEMS.forEach(item => {
    if (item.section !== currentSection) {
      currentSection = item.section;
      html += '<div class="hr-nav-section"><div class="hr-nav-label">' + item.section + '</div>';
    }
    const isActive = currentPage === item.id;
    const badge = item.badge && pendingCount > 0 ? '<span class="hr-nav-badge">' + pendingCount + '</span>' : '';
    html += '<a class="hr-nav-item' + (isActive ? ' active' : '') + '" onclick="navigate('' + item.id + '')">' + item.label + badge + '</a>';
    const nextItem = NAV_ITEMS[NAV_ITEMS.indexOf(item) + 1];
    if (!nextItem || nextItem.section !== currentSection) html += '</div>';
  });
  nav.innerHTML = html;
}

function renderBreadcrumb() {
  const names = { dashboard: 'Dashboard', requests: 'My Requests', approvals: 'Pending Approvals', calendar: 'Team Calendar', employees: 'Employee Directory', team: 'My Team', reports: 'Reports & Analytics', audit: 'Audit Log', settings: 'Settings' };
  document.getElementById('page-breadcrumb').textContent = names[currentPage] || currentPage;
}

function renderPage() {
  switch(currentPage) {
    case 'dashboard': renderDashboard(); break;
    case 'requests': renderRequests(); break;
    case 'approvals': renderApprovals(); break;
    case 'calendar': renderCalendar(); break;
    case 'employees': renderEmployees(); break;
    case 'team': renderTeam(); break;
    case 'reports': renderReports(); break;
    case 'audit': renderAudit(); break;
    case 'settings': renderSettings(); break;
    default: renderDashboard();
  }
}

function renderRequestRows(requests) {

  }
  return requests.map(r =>
    '<tr data-status="' + r.status + '" data-date="' + r.startDate + '"><td>' + getLeaveTag(r.type) + '</td><td style="white-space:nowrap;">' + formatDate(r.startDate) + ' – ' + formatDate(r.endDate) + '</td><td style="white-space:nowrap;">' + r.days + ' days</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (r.reason || '-') + '</td><td>' + getStatusBadge(r.status) + '</td><td style="white-space:nowrap;color:#999;font-size:12px;">' + timeAgo(r.createdAt) + '</td><td><div class="row-actions" style="display:flex;gap:4px;">' + (r.status === 'pending' ? '<button class="hr-icon-btn" style="width:28px;height:28px;" onclick="cancelRequest(\'' + r.id + '\')" title="Cancel" aria-label="Cancel request"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>' : '') + '<button class="hr-icon-btn" style="width:28px;height:28px;" onclick="viewRequestDetails(\'' + r.id + '\')" title="View details" aria-label="View details"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></td></tr>'
  ).join('');
}

function filterRequests(chip, status) {
  document.querySelectorAll('.hr-filters .hr-filter-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  document.querySelectorAll('#requests-tbody tr[data-status]').forEach(row => {
    row.style.display = (status === 'all' || row.dataset.status === status) ? '' : 'none';
  });
}

function sortRequests(sortBy) {
  const tbody = document.getElementById('requests-tbody');
  const rows = Array.from(tbody.querySelectorAll('tr[data-status]'));
  rows.sort((a, b) => {
    if (sortBy === 'newest') return new Date(b.querySelector('td:nth-child(6)').textContent) - new Date(a.querySelector('td:nth-child(6)').textContent);
    if (sortBy === 'oldest') return new Date(a.dataset.date) - new Date(b.dataset.date);
    if (sortBy === 'soonest') return new Date(a.dataset.date) - new Date(b.dataset.date);
    return 0;
  });
  rows.forEach(row => tbody.appendChild(row));
}

function renderCalendar() {
  const requests = leaveService.getAll();

  const month = now.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startOffset = firstDay.getDay();
  const daysInMonth = lastDay.getDate();

  document.getElementById('content').innerHTML =
    '<div class="hr-page-header"><div><div class="hr-page-title">Team Calendar</div><div class="hr-page-subtitle">' + now.toLocaleString('en', { month: 'long', year: 'numeric' }) + '</div></div></div>' +

      '<div class="hr-filter-chip active" onclick="toggleCalendarFilter(this,\'' + t.id + '\')" data-type="' + t.id + '"><span style="width:8px;height:8px;border-radius:50%;background:' + (t.color === 'blue' ? '#3b82f6' : t.color === 'red' ? '#ef4444' : t.color === 'green' ? '#10b981' : t.color === 'purple' ? '#8b5cf6' : '#f59e0b') + ';"></span>' + t.label + '</div>'
    ).join('') + '</div>' +

    '<div class="hr-calendar" id="calendar-grid">' +
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => '<div class="hr-cal-header">' + d + '</div>').join('') +
    Array.from({length: startOffset}, () => '<div class="hr-cal-day other"></div>').join('') +
    Array.from({length: daysInMonth}, (_, i) => {
      const day = i + 1;
      const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
      const dayRequests = requests.filter(r => {
        const s = new Date(r.startDate), e = new Date(r.endDate), d = new Date(dateStr);

    }).join('') +

  const metrics = reportService.getApprovalMetrics();

  const trendMonths = Object.keys(trends);
  const maxTrend = Math.max(...trendMonths.map(m => trends[m].total), 1);

  const deptNames = Object.keys(deptStats);
  const maxDept = Math.max(...deptNames.map(d => deptStats[d].onLeave), 1);

  document.getElementById('content').innerHTML =
    '<div class="hr-page-header"><div><div class="hr-page-title">Reports & Analytics</div><div class="hr-page-subtitle">Insights into leave patterns and team availability</div></div><button class="hr-btn hr-btn-secondary"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export</button></div>' +

    '<div class="hr-stat-grid hr-mb-xl">' +
    '<div class="hr-stat-card"><div class="hr-stat-label">Total requests</div><div class="hr-stat-value">' + metrics.total + '</div></div>' +
    '<div class="hr-stat-card"><div class="hr-stat-label">Approval rate</div><div class="hr-stat-value">' + (metrics.total > 0 ? Math.round(metrics.approved / metrics.total * 100) : 0) + '%</div><div class="hr-stat-delta up">' + metrics.approved + ' approved</div></div>' +
    '<div class="hr-stat-card"><div class="hr-stat-label">Rejection rate</div><div class="hr-stat-value">' + (metrics.total > 0 ? Math.round(metrics.rejected / metrics.total * 100) : 0) + '%</div><div class="hr-stat-delta down">' + metrics.rejected + ' rejected</div></div>' +
    '<div class="hr-stat-card"><div class="hr-stat-label">Pending</div><div class="hr-stat-value">' + metrics.pending + '</div><div class="hr-stat-delta neutral">awaiting action</div></div>' +
    '</div>' +

    '<div class="hr-grid-2 hr-mb-xl">' +
    '<div class="hr-card"><div class="hr-card-header"><div class="hr-card-title">Leave by Type</div></div><div class="hr-card-body" style="display:flex;align-items:center;justify-content:center;gap:32px;padding:32px;">' +
    '<div class="hr-donut"><svg width="140" height="140" viewBox="0 0 140 140"><circle cx="70" cy="70" r="60" fill="none" stroke="#f5f5f5" stroke-width="16"/>' +
    (() => {
      const types = ['vacation', 'sick', 'personal', 'remote'];
      const colors = ['#3b82f6', '#ef4444', '#8b5cf6', '#10b981'];
      const totals = types.map(t => trendMonths.reduce((s, m) => s + trends[m][t], 0));
      const total = totals.reduce((a, b) => a + b, 0) || 1;
      let offset = 0;
      return totals.map((val, i) => {
        const pct = val / total;
        const dash = pct * 377;
        const gap = 377 - dash;
        const el = '<circle cx="70" cy="70" r="60" fill="none" stroke="' + colors[i] + '" stroke-width="16" stroke-dasharray="' + dash + ' ' + gap + '" stroke-dashoffset="-' + offset + '" stroke-linecap="round" transform="rotate(-90 70 70)"/>';
        offset += dash;
        return el;
      }).join('');
    })() +
    '</svg><div class="hr-donut-center"><div class="hr-donut-value">' + trendMonths.reduce((s, m) => s + trends[m].total, 0) + '</div><div class="hr-donut-label">days total</div></div></div>' +
    '<div style="display:flex;flex-direction:column;gap:12px;">' +
    ['vacation', 'sick', 'personal', 'remote'].map((t, i) => {
      const total = trendMonths.reduce((s, m) => s + trends[m][t], 0);
      const colors = ['#3b82f6', '#ef4444', '#8b5cf6', '#10b981'];
      const labels = ['Vacation', 'Sick', 'Personal', 'Remote'];
      return '<div style="display:flex;align-items:center;gap:8px;"><div style="width:10px;height:10px;border-radius:50%;background:' + colors[i] + ';"></div><span style="font-size:13px;color:#666;width:70px;">' + labels[i] + '</span><span style="font-size:14px;font-weight:500;color:#111;">' + total + ' days</span></div>';
    }).join('') +
    '</div></div></div>' +

    '<div class="hr-card"><div class="hr-card-header"><div class="hr-card-title">Department Leave Load</div></div><div class="hr-card-body" style="display:flex;flex-direction:column;gap:12px;padding:16px 0;">' +
    deptNames.slice(0, 6).map(d => {
      const stat = deptStats[d];
      const pct = Math.min((stat.onLeave / (stat.employees * 20)) * 100, 100);
      return '<div style="display:flex;align-items:center;gap:12px;"><div style="width:100px;font-size:13px;font-weight:500;color:#111;">' + d + '</div><div style="flex:1;height:10px;background:#f5f5f5;border-radius:5px;overflow:hidden;"><div style="width:' + pct + '%;height:100%;background:#111;border-radius:5px;transition:width 0.8s;"></div></div><div style="width:100px;text-align:right;font-size:12px;color:#999;">' + stat.onLeave + 'd / ' + stat.employees + ' emp</div></div>';
    }).join('') +
    '</div></div>' +
    '</div>' +

    '<div class="hr-card"><div class="hr-card-header"><div class="hr-card-title">Monthly Leave Trends</div></div><div class="hr-card-body"><div class="hr-chart-bar" style="height:180px;gap:16px;padding:16px 0;">' +
    trendMonths.map((m, i) => {
      const val = trends[m].total;
      const height = Math.max((val / maxTrend) * 100, 4);
      return '<div class="hr-chart-bar-item"><div class="hr-chart-bar-value" style="font-size:13px;font-weight:500;">' + val + '</div><div class="hr-chart-bar-fill" style="height:' + height + '%;background:#111;opacity:' + (0.3 + (i / trendMonths.length) * 0.7) + ';"></div><div class="hr-chart-bar-label" style="font-size:12px;">' + m + '</div></div>';
    }).join('') +
    '</div></div></div>';
}

// ============================================================
// ACTIONS: APPROVE / REJECT / CANCEL
// ============================================================
function approveRequest(id) {
  const req = leaveService.getById(id);
  if (!req) return;
  leaveService.update(id, { status: 'approved', approvedBy: currentUser.id, approvedAt: new Date().toISOString() });
  auditService.log('leave_approved', id, 'Approved by ' + currentUser.name);
  showToast('Request approved successfully', 'success');
  renderNav();
  renderPage();
}

function rejectRequest(id) {
  const req = leaveService.getById(id);
  if (!req) return;
  openModal('Reject Request',
    '<div class="hr-form-group"><label class="hr-form-label">Reason for rejection <span style="color:#ef4444;">*</span></label><textarea class="hr-form-textarea" id="reject-reason" placeholder="Please explain why this request is being rejected..."></textarea></div>',
    '<button class="hr-btn hr-btn-secondary" onclick="closeModal()">Cancel</button><button class="hr-btn hr-btn-danger" onclick="confirmReject(\'' + id + '\')">Reject Request</button>'
  );
}

function confirmReject(id) {
  const reason = document.getElementById('reject-reason').value;
  if (!reason.trim()) { showToast('Please provide a rejection reason', 'error'); return; }
  leaveService.update(id, { status: 'rejected', approvedBy: currentUser.id, approvedAt: new Date().toISOString(), rejectionReason: reason });
  auditService.log('leave_rejected', id, 'Rejected by ' + currentUser.name + ': ' + reason);
  closeModal();
  showToast('Request rejected', 'info');
  renderNav();
  renderPage();
}

function cancelRequest(id) {
  if (!confirm('Are you sure you want to cancel this request?')) return;
  leaveService.update(id, { status: 'cancelled', cancelledAt: new Date().toISOString() });
  auditService.log('leave_cancelled', id, 'Cancelled by employee');
  showToast('Request cancelled', 'info');
  renderPage();
}

// ============================================================
function openNewRequestModal() {
  const user = employeeService.getById(currentUser.id);
  const balances = user?.balances || {};
  openModal('New Leave Request',
    '<div class="hr-form-row"><div class="hr-form-group"><label class="hr-form-label">Leave Type <span style="color:#ef4444;">*</span></label><select class="hr-form-select" id="new-type">' + LEAVE_TYPES.map(t => '<option value="' + t.id + '">' + t.label + ' (' + (balances[t.id] || 0) + ' days left)</option>').join('') + '</select></div><div class="hr-form-group"><label class="hr-form-label">Duration (days) <span style="color:#ef4444;">*</span></label><input type="number" class="hr-form-input" id="new-days" value="1" min="1" max="30"></div></div>' +
    '<div class="hr-form-row"><div class="hr-form-group"><label class="hr-form-label">Start Date <span style="color:#ef4444;">*</span></label><input type="date" class="hr-form-input" id="new-start"></div><div class="hr-form-group"><label class="hr-form-label">End Date <span style="color:#ef4444;">*</span></label><input type="date" class="hr-form-input" id="new-end"></div></div>' +
    '<div class="hr-form-group"><label class="hr-form-label">Reason</label><textarea class="hr-form-textarea" id="new-reason" placeholder="Briefly explain the reason for your leave..."></textarea></div>',
    '<button class="hr-btn hr-btn-secondary" onclick="closeModal()">Cancel</button><button class="hr-btn hr-btn-primary" onclick="submitNewRequest()">Submit Request</button>'
  );
  // Set default dates
  const today = new Date();
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);
  document.getElementById('new-start').value = today.toISOString().split('T')[0];
  document.getElementById('new-end').value = tomorrow.toISOString().split('T')[0];
}

function submitNewRequest() {
  const type = document.getElementById('new-type').value;
  const startDate = document.getElementById('new-start').value;
  const endDate = document.getElementById('new-end').value;
  const days = parseInt(document.getElementById('new-days').value);
  const reason = document.getElementById('new-reason').value;

  if (!startDate || !endDate || !days) { showToast('Please fill in all required fields', 'error'); return; }
  if (new Date(startDate) > new Date(endDate)) { showToast('End date must be after start date', 'error'); return; }

  leaveService.create({
    employeeId: currentUser.id,
    managerId: currentUser.managerId || 'emp_001',
    type, startDate, endDate, days, reason
  });
  auditService.log('leave_created', 'new', 'Leave request created: ' + days + ' days ' + type);
  closeModal();
  showToast('Request submitted successfully', 'success');
  renderNav();
  renderPage();
}

function viewRequestDetails(id) {
  const req = leaveService.getById(id);

  const emp = employeeService.getById(req.employeeId);
  const approver = req.approvedBy ? employeeService.getById(req.approvedBy) : null;

  let detailsHtml = '<div style="display:flex;flex-direction:column;gap:16px;">' +
    '<div style="display:flex;align-items:center;gap:12px;padding:12px;background:#f5f5f5;border-radius:8px;">' + getEmployeeCell(emp || { name: 'Unknown', department: '-', avatar: '?' }) + '<div style="margin-left:auto;">' + getStatusBadge(req.status) + '</div></div>' +
    '<div class="hr-form-row"><div class="hr-form-group"><label class="hr-form-label">Leave Type</label><div>' + getLeaveTag(req.type) + '</div></div><div class="hr-form-group"><label class="hr-form-label">Duration</label><div style="font-size:14px;color:#111;">' + req.days + ' days</div></div></div>' +
    '<div class="hr-form-row"><div class="hr-form-group"><label class="hr-form-label">Start Date</label><div style="font-size:14px;color:#111;">' + formatDate(req.startDate) + '</div></div><div class="hr-form-group"><label class="hr-form-label">End Date</label><div style="font-size:14px;color:#111;">' + formatDate(req.endDate) + '</div></div></div>' +
    '<div class="hr-form-group"><label class="hr-form-label">Reason</label><div style="font-size:14px;color:#111;padding:12px;background:#f5f5f5;border-radius:8px;">' + (req.reason || 'No reason provided') + '</div></div>' +
    '<div class="hr-form-group"><label class="hr-form-label">Requested</label><div style="font-size:13px;color:#666;">' + new Date(req.createdAt).toLocaleString() + '</div></div>';

  if (req.status === 'approved') {
    detailsHtml += '<div class="hr-form-group"><label class="hr-form-label">Approved By</label><div>' + (approver ? getEmployeeCell(approver) : 'Unknown') + '</div></div>' +
      '<div class="hr-form-group"><label class="hr-form-label">Approved At</label><div style="font-size:13px;color:#666;">' + new Date(req.approvedAt).toLocaleString() + '</div></div>' +
      (req.approverComment ? '<div class="hr-form-group"><label class="hr-form-label">Comment</label><div style="font-size:14px;color:#111;padding:12px;background:color-mix(in srgb,#10b981 5%,transparent);border-radius:8px;">' + req.approverComment + '</div></div>' : '');
  }
  if (req.status === 'rejected') {
    detailsHtml += '<div class="hr-form-group"><label class="hr-form-label">Rejected By</label><div>' + (approver ? getEmployeeCell(approver) : 'Unknown') + '</div></div>' +
      '<div class="hr-form-group"><label class="hr-form-label">Rejection Reason</label><div style="font-size:14px;color:#111;padding:12px;background:color-mix(in srgb,#ef4444 5%,transparent);border-radius:8px;">' + (req.rejectionReason || 'No reason provided') + '</div></div>';
  }

  detailsHtml += '</div>';
  openModal('Request Details', detailsHtml, '<button class="hr-btn hr-btn-secondary" onclick="closeModal()">Close</button>');
}

// ============================================================
// KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openNewRequestModal(); }
  if (e.key === 'a' || e.key === 'A') { e.preventDefault(); navigate('approvals'); }
  if (e.key === 'd' || e.key === 'D') { e.preventDefault(); navigate('dashboard'); }
  if (e.key === '/') { e.preventDefault(); document.querySelector('.hr-search-input')?.focus(); }
  if (e.key === 'Escape') { closeModal(); }
});
